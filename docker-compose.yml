version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trustgraph-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
      - MONGODB_URI=mongodb://mongo:27017/trustgraph
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=trustgraph_secret
      - SECRET_KEY=trustgraph-production-secret-2026
    depends_on:
      - mongo
      - neo4j
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/backend/uploads
      - ./backend/reports:/app/backend/reports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustgraph-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: trustgraph-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15
    container_name: trustgraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/trustgraph_secret
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  neo4j_data:
